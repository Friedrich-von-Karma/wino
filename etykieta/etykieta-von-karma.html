<style>
/* Layout: one hand-coloured woodcut label lying on a dark oak table, a single personalisation field below. Single dark look by choice. */
:root {
  color-scheme: dark;
  --table: #1a1310;
  --table-ink: #eadcc2;
  --muted: #a8977c;
  --field: #2a201b;
  --line: #4a3a30;
  --gold: #b38b3b;
  --blackletter: "UnifrakturMaguntia", "Old English Text MT", serif;
  --caps: "IM Fell English SC", "IM Fell English", Garamond, serif;
  --body: "IM Fell English", Garamond, Georgia, serif;
}
html, body { background: var(--table); color: var(--table-ink); }
body {
  font-family: var(--body);
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; justify-items: center; gap: 22px;
  background-image: repeating-linear-gradient(92deg, rgba(255,255,255,.012) 0 3px, rgba(0,0,0,.03) 3px 9px);
}
.label {
  width: 100%; max-width: 440px; aspect-ratio: 3 / 4; height: auto; display: block;
  filter: drop-shadow(0 16px 26px rgba(0,0,0,.6)) drop-shadow(0 2px 3px rgba(0,0,0,.5));
}
.controls { width: 100%; max-width: 440px; display: grid; gap: 6px; }
.controls label { font-family: var(--caps); font-size: 15px; letter-spacing: .08em; color: var(--muted); }
.controls input {
  font: 18px var(--body); padding: 10px 12px; border-radius: 3px;
  background: var(--field); color: var(--table-ink); border: 1px solid var(--line);
}
.controls input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.controls p { margin: 4px 0 0; font-size: 15px; color: var(--muted); line-height: 1.45; }
@page { size: 90mm 120mm; margin: 0; }
@media print {
  html, body { background: #fff; background-image: none; padding: 0; margin: 0; display: block; }
  .controls { display: none; }
  .label { width: 90mm; height: 120mm; max-width: none; filter: none; }
}
</style>

<script>
